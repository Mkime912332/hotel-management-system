<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Room | Kime Hotel</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; color: #172554; }
        header, footer { padding: 20px; background: #172554; color: white; text-align: center; }
        main { max-width: 560px; margin: 32px auto; padding: 24px; background: white; border-radius: 10px; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input, select { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button { margin-top: 20px; padding: 11px 20px; border: 0; border-radius: 5px; background: #172554; color: white; cursor: pointer; }
        .errorlist { color: #b91c1c; }
    </style>
</head>
<body>
<header>
    <h1>Book a Room</h1>
    <a href="{% url 'home' %}" style="color: white;">Back to home</a>
</header>
<main>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        {% endfor %}
        <button type="submit">Confirm Booking</button>
    </form>
</main>
<footer>Kime Hotel Management System</footer>
</body>
</html>
